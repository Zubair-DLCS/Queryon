name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: "Also run the real-model test (downloads a model)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  LLAMA_VERSION: "0.3.36"

jobs:
  tests:
    name: Unit tests and UI walkthrough (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Python packages (without llama.cpp; its tests are skipped here)
        run: |
          grep -v -e llama-cpp-python -e pywin32 requirements.txt > req-linux.txt
          pip install -r req-linux.txt pytest
      - name: Unit tests
        env: { QT_QPA_PLATFORM: offscreen, QUERYON_DATA_DIR: /tmp/queryon-test }
        run: python -m pytest -q tests
      - name: UI walkthrough with screenshots
        env: { QT_QPA_PLATFORM: offscreen, QUERYON_DATA_DIR: /tmp/queryon-ui }
        run: python scripts/ui_smoke.py screenshots
      - uses: actions/upload-artifact@v4
        with: { name: ui-screenshots, path: screenshots }

  build:
    name: Build Windows installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Restore llama.cpp builds
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: llama-${{ env.LLAMA_VERSION }}-win-py311-v1

      # Two builds of the AI engine: "fast" (AVX2, most PCs) and "compatible" (older/budget
      # CPUs without AVX2). Building with GGML_NATIVE=OFF stops it tuning for GitHub's CPU.
      - name: Build llama-cpp-python (fast + compatible)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:CMAKE_ARGS = "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
          pip wheel "llama-cpp-python==$env:LLAMA_VERSION" --no-deps --no-binary llama-cpp-python --no-cache-dir -w wheels/fast
          $env:CMAKE_ARGS = "-DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
          pip wheel "llama-cpp-python==$env:LLAMA_VERSION" --no-deps --no-binary llama-cpp-python --no-cache-dir -w wheels/compat

      - name: Install dependencies
        shell: pwsh
        run: |
          pip install (Get-ChildItem wheels/fast/*.whl).FullName
          pip install -r requirements.txt pyinstaller

      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/queryon.spec

      - name: Add Tesseract and the compatible engine
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "dist\Queryon\tesseract"
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null
          Copy-Item "$src\*.exe","$src\*.dll" $dst
          Copy-Item "$src\tessdata\eng.traineddata","$src\tessdata\osd.traineddata" "$dst\tessdata"
          Remove-Item "$dst\unins*.exe" -ErrorAction SilentlyContinue
          # compatible llama.cpp DLLs, chosen at runtime on CPUs without AVX2
          $whl = (Get-ChildItem wheels/compat/*.whl).FullName
          python -c "import zipfile,sys,os; z=zipfile.ZipFile(sys.argv[1]); os.makedirs(sys.argv[2],exist_ok=True); [open(os.path.join(sys.argv[2],os.path.basename(n)),'wb').write(z.read(n)) for n in z.namelist() if n.startswith('llama_cpp/lib/') and n.lower().endswith('.dll')]" $whl dist\Queryon\llama_compat
          New-Item -ItemType Directory -Force -Path dist\Queryon\models | Out-Null
          Get-ChildItem dist\Queryon\llama_compat

      - name: Self-test the packaged app (fast and compatible engines)
        shell: pwsh
        run: |
          $p = Start-Process dist\Queryon\Queryon.exe -ArgumentList "--selftest","selftest-fast.txt" -Wait -PassThru
          Get-Content selftest-fast.txt
          if ($p.ExitCode -ne 0) { throw "self-test (fast) failed" }
          $env:QUERYON_FORCE_COMPAT = "1"
          $p = Start-Process dist\Queryon\Queryon.exe -ArgumentList "--selftest","selftest-compat.txt" -Wait -PassThru
          Get-Content selftest-compat.txt
          if ($p.ExitCode -ne 0) { throw "self-test (compatible) failed" }

      - name: Build installer (Inno Setup)
        id: installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $ver = (python -c "import queryon; print(queryon.APP_VERSION)")
          iscc /DAppVersion=$ver packaging\installer.iss
          "version=$ver" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path dist\Queryon -DestinationPath "dist\Queryon-$ver-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Queryon-Windows
          path: |
            dist/Queryon-Setup-*.exe
            dist/Queryon-*-portable.zip
            selftest-*.txt
      - uses: actions/upload-artifact@v4
        with: { name: llama-wheels, path: wheels, retention-days: 3 }

      # Builds of main publish (or refresh) the release for the current version,
      # e.g. v1.0.0, with the installer and portable zip attached.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.installer.outputs.version }}
          name: Queryon ${{ steps.installer.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            **Queryon** - chat with your study documents, get simplified 50% / 25% / 10% versions,
            practice quizzes and flashcards, offline on an ordinary Windows PC.

            Developed by **Malak Zubair**, Assistant Professor, G.C.M.S Timergara.

            **Download:** `Queryon-Setup-${{ steps.installer.outputs.version }}.exe` (installer, recommended)
            or `Queryon-${{ steps.installer.outputs.version }}-portable.zip` (no install; unzip and run `Queryon.exe`).

            Windows 10/11, 64-bit. On first start Queryon offers a one-time AI model download
            (1-2 GB) suited to the PC's RAM; after that no internet is needed.
            Windows SmartScreen may warn that the app is unrecognised because it is not code-signed:
            choose "More info" then "Run anyway".
          files: |
            dist/Queryon-Setup-*.exe
            dist/Queryon-*-portable.zip

  real-model:
    name: Real model test (Windows, ${{ matrix.model }} model)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        model: [light, standard]
    needs: build
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.real_model)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: llama-wheels, path: wheels }
      - name: Install
        shell: pwsh
        run: |
          pip install (Get-ChildItem wheels/fast/*.whl).FullName
          pip install -r requirements.txt
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Queryon\models
          key: model-${{ matrix.model }}-v1
      - name: Run chat, simplify, quiz and flashcards
        run: python scripts/real_model_test.py ${{ matrix.model }} real_model_report.md
      - name: Show report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path real_model_report.md) { Get-Content real_model_report.md; Get-Content real_model_report.md | Out-File -Append $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "real-model-report-${{ matrix.model }}", path: real_model_report.md }
